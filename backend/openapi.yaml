    "/api/v2/pesquisas": {
      "post": {
        "summary": "Enviar pesquisa completa em uma transação",
        "operationId": "post_api_v2_pesquisas",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "chave_envio": {
                    "type": "string",
                    "format": "uuid",
                    "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
                  },
                  "questionario_id": {
                    "type": "string",
                    "format": "uuid",
                    "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
                  },
                  "nota": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 10
                  },
                  "canal": {
                    "type": "string",
                    "enum": [
                      "celular",
                      "tablet"
                    ]
                  },
                  "privacidade_versao": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 80
                  },
                  "etapas": {
                    "type": "object",
                    "properties": {},
                    "required": [],
                    "additionalProperties": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 10
                    },
                    "maxProperties": 20,
                    "propertyNames": {
                      "pattern": "^[a-z][a-z0-9_]{0,49}$"
                    }
                  },
                  "tipo": {
                    "anyOf": [
                      {
                        "type": "string",
                        "enum": [
                          "elogio",
                          "reclamacao",
                          "sugestao"
                        ]
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "comentario": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 2000
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "telefone": {
                    "anyOf": [
                      {
                        "type": "string",
                        "minLength": 10,
                        "maxLength": 25,
                        "pattern": "^[0-9()+ .-]+$"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "consentimento": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "chave_envio",
                  "questionario_id",
                  "nota",
                  "canal",
                  "privacidade_versao"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Operação concluída. Listas usam X-Next-Cursor para continuação; listas vazias encerram a paginação.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "recebida",
                    "protocolo"
                  ],
                  "properties": {
                    "recebida": {
                      "const": true
                    },
                    "protocolo": {
                      "type": [
                        "integer",
                        "null"
                      ]
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "413": {
            "$ref": "#/components/responses/Error413"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "502": {
